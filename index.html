<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Portfolio of Rashmishara Nawodani, an Information Technology undergraduate at the University of Moratuwa aspiring to be a Software Engineer. Explore projects, technical skills, education, and certifications." />
    <meta name="author" content="Rashmishara Nawodani" />
    <title>Rashmishara Nawodani | Portfolio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('theme');
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var theme = saved === 'dark' || saved === 'light' ? saved : (prefersDark ? 'dark' : 'light');
          document.documentElement.classList.remove('light', 'dark');
          document.documentElement.classList.add(theme);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root">
      <div style="position:fixed;inset:0;background-color:#080915;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#00F2FE;font-family:'Inter',system-ui,-apple-system,sans-serif;z-index:99999;">
        <div style="width:48px;height:48px;border:3px solid rgba(0,242,254,0.15);border-top-color:#00F2FE;border-right-color:#8B5CF6;border-radius:50%;animation:initial-spin 0.8s linear infinite;"></div>
        <div style="margin-top:18px;font-size:12px;letter-spacing:0.2em;text-transform:uppercase;font-weight:600;color:#94A3B8;">Initialising Portfolio...</div>
        <style>@keyframes initial-spin{to{transform:rotate(360deg)}}</style>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
